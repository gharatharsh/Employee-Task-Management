<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Update Developer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #eef2f3;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    fieldset {
        background: #fff;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        width: 320px;
    }

    legend {
        font-size: 1.2em;
        font-weight: bold;
        color: #333;
        text-align: center;
    }

    label {
        display: block;
        margin-top: 10px;
        font-size: 14px;
        color: #444;
    }

    input[type="number"],
    input[type="text"],
    select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }

    input[type="submit"] {
        margin-top: 15px;
        width: 100%;
        padding: 10px;
        background: #007BFF;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background: #0056b3;
    }
</style>
</head>
<body>

    <fieldset>
        <legend>Update Developer / Task</legend>

        <form action="updateDeveloper" method="get">

            <label for="employeeId">Developer ID:</label>
            <input type="number" id="employeeId" name="employeeId" required>

            <label for="taskId">Task ID:</label>
            <input type="number" id="taskId" name="taskId">

            <label for="option">Select what to update:</label>
            <select name="option" id="option" required>
                <option value="employeeName">Name</option>
                <option value="email">Email</option>
                <option value="phoneNumber">Phone Number</option>
                <option value="status">Task Status</option>
            </select>

            <label for="value">Enter new value:</label>
            <input type="text" id="value" name="value">

            <input type="submit" value="Update">
        </form>
    </fieldset>

</body>
</html>
