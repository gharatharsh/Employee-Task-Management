<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Developer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin: 0;
        }
        h1 {
            background: #4c1d95;
            color: white;
            padding: 20px;
            margin: 0;
        }
        form {
            background: white;
            width: 300px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            text-align: left;
        }
        label {
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;     
        }

    </style>
</head>

<body>

    <h1>Delete Developer</h1>

    <form action="deleteDeveloper">

        <label>Enter Developer Id:</label>
        <input type="number" name="employeeId" required>

        <br><br>

        <button type="submit">Delete</button>

    </form>

</body>
</html>
