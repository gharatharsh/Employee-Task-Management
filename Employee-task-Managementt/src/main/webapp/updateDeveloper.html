<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Update Developer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #b7dee8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    form {
        background: #fff;
        padding: 25px 35px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        width: 350px;
    }

    fieldset {
        border: none;
        padding: 0;
    }

    legend {
        font-size: 1.5em;
        font-weight: bold;
        color: #333;
        margin-bottom: 15px;
        text-align: center;
    }

    label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
        color: #444;
    }

    select {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        background-color: #f9f9f9;
        transition: 0.3s;
    }

    select:focus {
        border-color: #007BFF;
        box-shadow: 0 0 5px rgba(0,123,255,0.5);
        outline: none;
    }

    input[type="submit"] {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        background: #007BFF;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    input[type="submit"]:hover {
        background: #0056b3;
        transform: scale(1.05);
    }
</style>

</head>
<body>

<form action="developerOption.jsp">
    <fieldset>
        <legend>Update Developer</legend>

        <label for="option">Select what you want to update:</label>
        <select name="option" id="option">
            <option value="Name">Name</option>
            <option value="Email">Email</option>
            <option value="PhoneNumber">Phone Number</option>
        </select>

        <input type="submit" value="Submit">
    </fieldset>
</form>

</body>
</html>
