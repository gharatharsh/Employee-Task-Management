<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Create Task</title>

<style>
* {
	box-sizing: border-box;
}

body {
	margin: 0;
	padding: 0;
	font-family: Arial, sans-serif;
	background: lightblue;
	height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
}

.container {
	background: white;
	width: 400px;
	padding: 35px;
	border-radius: 15px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

h1 {
	text-align: center;
	color: #333;
	margin-bottom: 30px;
}

label {
	display: block;
	margin-bottom: 8px;
	color: #555;
	font-weight: bold;
}

input {
	width: 100%;
	padding: 12px;
	margin-bottom: 20px;
	border: 1px solid #ccc;
	border-radius: 8px;
	font-size: 15px;
	outline: none;
}

button {
	width: 100%;
	padding: 12px;
	background: #667eea;
	color: white;
	border: none;
	border-radius: 8px;
	font-size: 16px;
	font-weight: bold;
	transition: 0.3s;
}
</style>
</head>

<body>

	<div class="container">

		<h1>Create Task</h1>

		<form action="createTask">

			<label for="task">Enter Task Name:</label> <input type="text"
				name="task" id="task" placeholder="Enter task name" required>

			<label for="duration">Enter Task Duration:</label> <input type="text"
				name="duration" id="duration" placeholder="Enter duration" required>

			<button type="submit">Create Task</button>

		</form>

	</div>

</body>
</html>
